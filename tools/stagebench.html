<!doctype html>
<meta charset="utf-8">
<title>Stage bench</title>
<!--
  A page that holds the game in an iframe of any size (a window cannot always be resized) and times Level Mode
  stage 1 at fixed places. Serve the repository (tools/serve.py 8962), open /tools/stagebench.html, then in the console:

    await SB.load(1279, 639)             // the game at that CSS size (device pixel ratio is the window's); a third argument is another copy of the game's folder, to compare with
    await SB.table()                      // per place: physics, views, render, frame (ms, the least of 5 runs of 30 frames), draw calls, triangles, GPU ms
    await SB.table({ only: ['chapel'], gpu: false })
    SB.hop('chapel')                      // stand the player at a place, the stage woken round him

  `gpu` is the render's time on the graphics card (EXT_disjoint_timer_query): steadier than the wall clock when
  the machine is shared. Everything here is synchronous: a hidden tab's timers are throttled to nothing.
-->
<body style="margin:0">
<script type="module">
  const PLACES = [
    ['cliff-start', [-110, 14, -4], 0], ['cliff-path', [-80, 12, -4], 0], ['cliff-leg3', [-70, 4.5, 20], 0],
    ['gorge', [-44, 0, 41.5], 0], ['ledge', [-3, 0, 54.2], 0], ['gatehouse', [2.2, 0, 46.2], 0],
    ['oillet', [17.7, 6, 37], -1.57], ['ascent', [17, 11, 10], -1.57], ['quad', [12, 12.18, -1], -1.57],
    ['vault', [24, 6, -22.5], 0], ['keep', [52, 12.18, -23.8], 0], ['wallwalk', [30, 24.93, -36], 3.14],
    ['chapel', [-6, 17.18, -36], 3.14], ['cell', [-9, 17.18, -46], 1.57],
  ];
  const { floorAt } = await import('/src/physics/terrain.js');
  let frame = null;
  const game = () => frame.contentWindow;
  const SB = window.SB = {
    places: PLACES,
    /** The game in a fresh iframe of w x h CSS pixels; resolves when it is ready. */
    load(w, h, base = '/') {
      return new Promise((done) => {
        frame?.remove();
        frame = document.createElement('iframe');
        frame.style.cssText = `width:${w}px;height:${h}px;border:0;position:absolute;left:0;top:0`;
        frame.src = `${base}?${Math.random()}`;
        frame.onload = () => {
          const wait = () => (game().boxer ? done(game()) : setTimeout(wait, 100));
          wait();
        };
        document.body.appendChild(frame);
      });
    },
    game,
    /** The stage entered afresh, the player standing at `place` (a name above, or [x, floorHint, z]). Returns { floor, state, y }. */
    hop(place, yaw = 0) {
      const g = game();
      const found = PLACES.find(([name]) => name === place);
      const [at, facing] = found ? [found[1], found[2]] : [place, yaw];
      g.boxer.skipIntro();
      g.boxer.adaptiveResolution(false);
      g.boxer.levelMode('dunnottar');
      const level = g.boxer.levelRun();
      // (Whole steps only: a part of a step is drawn blended with draw(0), whose camera does not like a zero dt.)
      // First onto the spot (the sections wake on the first step), then onto the floor found there.
      level.put([at[0], at[1] + 0.3, at[2]], facing);
      g.boxer.advance(2 / 60);
      const world = g.boxer.state.world;
      const floor = floorAt(world.arena.terrain, at[0], at[2], at[1] + 1.5);
      if (floor == null) return { floor: null, state: 'lost' };
      level.put([at[0], floor, at[2]], facing);
      g.boxer.advance(24 / 60);
      const me = world.fighters[0];
      return { floor: +floor.toFixed(2), state: me.state, y: +me.x[25].toFixed(2) };
    },
    /** The GPU time of `frames` draws (ms): { med, n }. */
    async gpu(frames = 12) {
      const g = game();
      const renderer = g.boxer.scene.renderer;
      const gl = renderer.getContext();
      const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
      if (!ext) return { med: -1, n: 0 };
      const original = renderer.render;
      const queries = [];
      renderer.render = function (...args) {
        const query = gl.createQuery();
        gl.beginQuery(ext.TIME_ELAPSED_EXT, query);
        try {
          return original.apply(this, args);
        } finally {
          gl.endQuery(ext.TIME_ELAPSED_EXT);
          queries.push(query);
        }
      };
      g.boxer.bench(frames);
      renderer.render = original;
      gl.finish();
      // (A query's answer arrives a turn of the event loop later.)
      await new Promise((done) => setTimeout(done, 60));
      const times = [];
      for (const query of queries) {
        if (gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)) times.push(gl.getQueryParameter(query, gl.QUERY_RESULT) / 1e6);
        gl.deleteQuery(query);
      }
      times.sort((a, b) => a - b);
      return times.length ? { med: +times[Math.floor(times.length / 2)].toFixed(2), n: times.length } : { med: -1, n: 0 };
    },
    /**
     * What the picture is made of now: triangles and meshes drawn (visible, and meeting the camera's frustum) by kind:
     * land, each section's detail and silhouette, the sea and sky, the men (by how they are drawn), the rest.
     */
    census() {
      const g = game();
      const THREE_ = g.THREE;
      const scene = g.boxer.scene;
      scene.camera.updateMatrixWorld();
      const frustum = new THREE_.Frustum().setFromProjectionMatrix(new THREE_.Matrix4().multiplyMatrices(scene.camera.projectionMatrix, scene.camera.matrixWorldInverse));
      const stats = {};
      const shown = (object) => {
        for (let up = object; up; up = up.parent) if (!up.visible) return false;
        return true;
      };
      const menOf = new Map();
      for (const view of g.boxer.state.views) menOf.set(view.group, view);
      const kindOf = (object) => {
        for (let up = object; up; up = up.parent) {
          if (menOf.has(up)) {
            const view = menOf.get(up);
            return `man:${view.fighter.spawn?.id ?? 'player'}${view.baked ? (view.draw?.far ? ' far' : ' near') : ' full'}`;
          }
          if (/^(detail|silhouette):/.test(up.name)) return up.name;
          if (up.name === 'land' || up.name === 'stage-sea') return up.name;
        }
        return 'other';
      };
      scene.scene.traverse((object) => {
        if (!(object.isMesh || object.isLine || object.isPoints) || !shown(object)) return;
        const geometry = object.geometry;
        const triangles = ((geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3) * (object.isInstancedMesh ? object.count : 1);
        let inView = true;
        if (object.frustumCulled !== false) {
          if (!geometry.boundingSphere) geometry.computeBoundingSphere();
          inView = frustum.intersectsSphere(geometry.boundingSphere.clone().applyMatrix4(object.matrixWorld));
        }
        const kind = kindOf(object);
        const entry = (stats[kind] ??= { meshes: 0, triangles: 0 });
        if (inView) {
          entry.meshes += 1;
          entry.triangles += Math.round(triangles);
        }
      });
      return Object.entries(stats).filter(([, v]) => v.meshes).map(([k, v]) => `${k.padEnd(24)} meshes ${String(v.meshes).padStart(3)} tris ${v.triangles}`).join('\n');
    },
    /**
     * What each kind of thing in the picture costs here: for every category, its draw calls and triangles drawn alone, and the card's time (ms, the median of
     * `frames` draws, EXT_disjoint_timer_query) with everything, with only that kind, and with all but that kind (so the saving of hiding it is the difference).
     * The scene is not updated between draws, so the numbers compare like with like. `ratio`: the renderer's pixel ratio for the run (default: as it is).
     */
    async prof({ frames = 14, ratio = null, gpu = true } = {}) {
      const g = game();
      const view = g.boxer.scene;
      const renderer = view.renderer;
      const gl = renderer.getContext();
      const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
      if (ratio) renderer.setPixelRatio(ratio);
      const stageView = g.boxer.stage().view;
      const mats = stageView.mats;
      const menOf = new Map();
      for (const v of g.boxer.state.views) menOf.set(v.group, v);
      const categoryOf = (object) => {
        if (object.material === mats.wear) return 'decals';
        for (let up = object; up; up = up.parent) {
          if (menOf.has(up)) {
            const v = menOf.get(up);
            return v.fighter.id === 0 ? 'man:player' : v.baked ? (v.draw?.far ? 'man:far' : 'man:near') : 'man:full';
          }
          if (/^(detail):/.test(up.name)) return 'castle';
          if (/^silhouette:/.test(up.name)) return 'silhouette';
          if (up.name === 'land') return 'land';
          if (up.name === 'stage-sea') return 'sea';
          if (up.name?.startsWith('dyn:')) return 'dynamics';
          if (up.name === 'storm' && object.material?.side === g.THREE.BackSide) return 'sky';
          if (up.name === 'storm') return object.isLineSegments ? 'rain' : 'weather-other';
        }
        return 'other';
      };
      const all = [];
      view.scene.traverse((object) => {
        if (object.isMesh || object.isLine || object.isPoints || object.isSprite) all.push([object, categoryOf(object)]);
      });
      const names = [...new Set(all.map(([, c]) => c))].sort();
      const set = (show) => {
        for (const [object, c] of all) {
          if (object.userData.__v === undefined) object.userData.__v = object.visible;
          object.visible = object.userData.__v && show(c);
        }
      };
      const restore = () => {
        for (const [object] of all) {
          object.visible = object.userData.__v ?? object.visible;
          delete object.userData.__v;
        }
      };
      // (A read of one pixel is what makes the page wait for the card: `finish` does not, in Chrome.)
      const pixel = new Uint8Array(4);
      const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      const med = (a) => (a.length ? +a.sort((x, y) => x - y)[Math.floor(a.length / 2)].toFixed(2) : -1);
      // One round: n draws back to back and the card waited for: the mean time of a draw (steadier than one query each when the machine is shared), and the page's own
      // time to issue one (the card idle first, so it is not the queue being waited for).
      const round = async (n) => {
        sync();
        const t0 = performance.now();
        for (let k = 0; k < n; k += 1) renderer.render(view.scene, view.camera);
        sync();
        const wall = (performance.now() - t0) / n;
        const cpu = [];
        for (let k = 0; k < Math.min(n, 6); k += 1) {
          sync();
          const t1 = performance.now();
          renderer.render(view.scene, view.camera);
          cpu.push(performance.now() - t1);
        }
        return { gpu: +wall.toFixed(2), cpu: med(cpu) };
      };
      // The least of three rounds of each: a shared machine only ever adds time.
      const time = async (n) => {
        const runs = [];
        for (let k = 0; k < 3; k += 1) runs.push(await round(n));
        return { gpu: Math.min(...runs.map((r) => r.gpu)), cpu: Math.min(...runs.map((r) => r.cpu)) };
      };
      const count = () => {
        renderer.render(view.scene, view.camera);
        return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
      };
      await time(4);
      const rows = {};
      const full = { ...count(), ...(await time(frames)) };
      rows.ALL = full;
      for (const name of names) {
        set((c) => c === name);
        const alone = { ...count(), ...(await time(frames)) };
        restore();
        set((c) => c !== name);
        const without = await time(frames);
        restore();
        rows[name] = { ...alone, savedGpu: +(full.gpu - without.gpu).toFixed(2), savedCpu: +(full.cpu - without.cpu).toFixed(2) };
      }
      restore();
      return rows;
    },
    /** `prof` as text: one line per category. */
    async profText(options) {
      const rows = await SB.prof(options);
      return Object.entries(rows).map(([k, v]) => `${k.padEnd(14)} calls ${String(v.calls).padStart(3)} tris ${String(v.tris).padStart(6)} ms ${v.gpu} cpu ${v.cpu}${v.savedGpu === undefined ? '' : ` | saves ${v.savedGpu} / ${v.savedCpu}`}`).join('\n');
    },
    /**
     * `prof` at several places, in the background (a call that waits longer than the browser tool's limit is cut off): `SB.suite(['quad', 'vault'], { frames: 8 })`,
     * then poll `SB.done`; `SB.print()` is the table: per place, per kind, [calls, thousands of triangles, ms], and the ms hiding it saves.
     */
    suite(places, options = {}) {
      SB.done = false;
      SB.results = {};
      (async () => {
        for (const name of places) {
          SB.hop(name);
          game().boxer.bench(10);
          SB.results[name] = await SB.prof(options);
        }
        SB.done = true;
      })();
      return 'started';
    },
    print(only = null) {
      return Object.entries(SB.results ?? {}).filter(([n]) => !only || only.includes(n)).map(([name, rows]) => `${name}: ` + Object.entries(rows).map(([k, v]) => `${k.replace('weather-other', 'wx').replace('silhouette', 'sil').replace('dynamics', 'dyn').replace('man:', 'm.')} ${v.calls}/${(v.tris / 1000).toFixed(1)}k/${v.gpu}${v.savedGpu === undefined ? '' : `/s${v.savedGpu}`}`).join(' | ')).join('\n');
    },
    /**
     * A/B on the frozen picture at a place: `variants` is { name: [apply, undo] } (functions of the game's window); each is drawn `frames` times back to back, the
     * rounds interleaved (the least of them is kept: a shared machine only ever adds time). Resolves { name: ms }. The first variant should be { base: [() => {}, () => {]] }.
     */
    async ab(variants, { rounds = 5, frames = 10 } = {}) {
      const g = game();
      const view = g.boxer.scene;
      const gl = view.renderer.getContext();
      const pixel = new Uint8Array(4);
      const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      const best = {};
      const calls = {};
      for (let r = 0; r < rounds; r += 1) {
        for (const [name, [apply, undo]] of Object.entries(variants)) {
          apply(g);
          sync();
          const t0 = performance.now();
          for (let k = 0; k < frames; k += 1) view.renderer.render(view.scene, view.camera);
          sync();
          const ms = (performance.now() - t0) / frames;
          calls[name] = [view.renderer.info.render.calls, view.renderer.info.render.triangles];
          undo(g);
          best[name] = Math.min(best[name] ?? Infinity, ms);
          await new Promise((done) => setTimeout(done, 0));
        }
      }
      return Object.fromEntries(Object.entries(best).map(([k, v]) => [k, `${v.toFixed(2)}ms ${calls[k][0]}c ${(calls[k][1] / 1000).toFixed(0)}kt`]));
    },
    /** The usual A/B variants (see `ab`): the picture with one kind of thing, or one cost of the shader, taken away. */
    async standard() {
      const g = game();
      const ks = await g.eval("import('/src/levelmode/kitshadow.js')");
      const view = g.boxer.scene;
      const mats = g.boxer.stage().view.mats;
      const hide = (test) => {
        const list = [];
        view.scene.traverse((o) => {
          if ((o.isMesh || o.isLine || o.isPoints || o.isSprite) && test(o)) list.push(o);
        });
        return [() => list.forEach((o) => { o.userData.__vis = o.visible; o.visible = false; }), () => list.forEach((o) => { o.visible = o.userData.__vis; })];
      };
      const under = (o, name) => {
        for (let up = o; up; up = up.parent) if (up.name === name) return true;
        return false;
      };
      const menGroups = new Set(g.boxer.state.views.map((v) => v.group));
      const isMan = (o) => {
        for (let up = o; up; up = up.parent) if (menGroups.has(up)) return true;
        return false;
      };
      const info = ks.ktShadow.uKitShadowInfo.value;
      let kept = 0;
      return {
        base: [() => {}, () => {}],
        'no baked shadow': [() => { kept = info.x; info.x = 0; }, () => { info.x = kept; }],
        'no decals': hide((o) => o.material === mats.wear),
        'no sea': hide((o) => under(o, 'stage-sea')),
        'no sky': hide((o) => under(o, 'storm') && o.material?.side === g.THREE.BackSide),
        'no rain': hide((o) => o.isLineSegments),
        'no men': hide(isMan),
        'no castle': hide((o) => /^detail:/.test(o.parent?.name ?? '') || (o.parent && /^detail:|^dyn:/.test(o.parent.parent?.name ?? ''))),
        'no land': hide((o) => under(o, 'land')),
        'flat shading': [() => { view.scene.overrideMaterial = new g.THREE.MeshBasicMaterial({ color: 0x808080 }); }, () => { view.scene.overrideMaterial = null; }],
        'ratio 1': [() => view.renderer.setPixelRatio(1), () => view.renderer.setPixelRatio(2)],
      };
    },
    /** A/B variants on the lights and the material's cost (see `ab`). */
    async lighting() {
      const g = game();
      const view = g.boxer.scene;
      const T = g.THREE;
      const mats = g.boxer.stage().view.mats;
      const lights = view.scene.children.filter((c) => c.isLight);
      const flat = (make) => {
        let m = null;
        return [() => { m ??= make(); view.scene.overrideMaterial = m; }, () => { view.scene.overrideMaterial = null; }];
      };
      const light = (test) => {
        const list = lights.filter(test);
        return [() => list.forEach((l) => { l.userData.__v = l.visible; l.visible = false; }), () => list.forEach((l) => { l.visible = l.userData.__v; })];
      };
      return {
        base: [() => {}, () => {}],
        'std plain': flat(() => new T.MeshStandardMaterial({ vertexColors: true, color: 0x808080 })),
        'std+map': flat(() => new T.MeshStandardMaterial({ vertexColors: true, map: mats.ashlar.map })),
        'lambert+map': flat(() => new T.MeshLambertMaterial({ vertexColors: true, map: mats.ashlar.map })),
        'no key spot': light((l) => l.isSpotLight),
        'no rim': light((l) => l.isDirectionalLight && !l.castShadow && l.intensity < 0.5 && l.intensity > 0.05),
        'no points': light((l) => l.isPointLight),
        'no probe/hemi': light((l) => l.isHemisphereLight || l.isLightProbe),
      };
    },
    /** A/B variants on the kit shader's parts (see `ab`). */
    async shader() {
      const g = game();
      const mats = g.boxer.stage().view.mats;
      const ks = await g.eval("import('/src/levelmode/kitshadow.js')");
      const kt = await g.eval("import('/src/levelmode/kittex.js')");
      const stone = ['ashlar', 'ruin', 'rubble', 'rock', 'cobble', 'flags', 'path', 'iron'];
      const env = (on) => stone.forEach((n) => { mats[n].envMap = on ? mats.water.envMap : null; mats[n].needsUpdate = true; });
      const info = ks.ktShadow.uKitShadowInfo.value;
      let held = 0;
      return {
        base: [() => {}, () => {}],
        'no stone env': [() => env(false), () => env(true)],
        'no shadow': [() => { held = info.x; info.x = 0; }, () => { info.x = held; }],
        'no pools': [() => { kt.ktWeather.uKitPools.value = 0; }, () => { kt.ktWeather.uKitPools.value = 0.6; }],
      };
    },
    /** A/B: the kit shaders without their `discard` (the cut-away's dither), which can turn off a card's early depth test. */
    async discard() {
      const g = game();
      const mats = g.boxer.stage().view.mats;
      const names = Object.keys(mats).filter((n) => Object.prototype.hasOwnProperty.call(mats[n], 'customProgramCacheKey') && /^kit-c/.test(mats[n].customProgramCacheKey()));
      const saved = {};
      const strip = (on) => {
        for (const n of names) {
          const m = mats[n];
          if (on) {
            saved[n] = [m.onBeforeCompile, m.customProgramCacheKey];
            const original = m.onBeforeCompile;
            const key = m.customProgramCacheKey;
            m.onBeforeCompile = (shader, r) => { original(shader, r); shader.fragmentShader = shader.fragmentShader.replace('discard;', ';'); };
            m.customProgramCacheKey = () => `${key()}-nd`;
          } else {
            [m.onBeforeCompile, m.customProgramCacheKey] = saved[n];
          }
          m.needsUpdate = true;
        }
      };
      return { base: [() => {}, () => {}], 'no discard': [() => strip(true), () => strip(false)] };
    },
    /**
     * This copy of the game against another (`base`: a folder served beside it, e.g. a `git archive` of an earlier commit linked as /.base/), in turns, the least of
     * `rounds` fresh runs of each at each place: { place: { new: {...}, base: {...} } } into SB.cmp (poll SB.done). `ratio`: a pixel ratio to set on both.
     */
    compare(places, { base = '/.base/', rounds = 3, frames = 30, width = 1279, height = 639, ratio = null, setup = null } = {}) {
      SB.done = false;
      SB.cmp = {};
      (async () => {
        try {
          for (const name of places) {
            const out = (SB.cmp[name] = {});
            for (let r = 0; r < rounds; r += 1) {
              for (const [side, root] of [['new', '/'], ['base', base]]) {
                await SB.load(width, height, root);
                const where = SB.hop(name);
                const g = game();
                if (ratio) g.boxer.scene.renderer.setPixelRatio(ratio);
                if (setup) await setup(g, side);
                g.boxer.bench(20);
                const runs = [0, 1, 2].map(() => g.boxer.bench(frames));
                const least = (key) => Math.min(...runs.map((run) => run[key]));
                const row = { render: least('render'), frame: least('frame'), views: least('views'), calls: runs[0].calls, tris: runs[0].triangles };
                const best = out[side];
                out[side] = best ? Object.fromEntries(Object.keys(row).map((k) => [k, Math.min(best[k], row[k])])) : row;
                if (where.state === 'lost') out[side].error = true;
              }
            }
          }
        } catch (error) {
          SB.cmp.error = String(error.stack).slice(0, 500);
        }
        SB.done = true;
      })();
      return 'started';
    },
    printCompare() {
      return Object.entries(SB.cmp ?? {}).map(([name, v]) => (v?.new ? `${name.padEnd(12)} new rd ${v.new.render} fr ${v.new.frame} c ${v.new.calls} t ${(v.new.tris / 1000).toFixed(0)}k | base rd ${v.base.render} fr ${v.base.frame} c ${v.base.calls} t ${(v.base.tris / 1000).toFixed(0)}k` : `${name} ${JSON.stringify(v)}`)).join('\n');
    },
    /** A/B variants on the quality tiers (see `ab`): the picture at each tier at the same pixel ratio, and the lowest rung (low tier, the floor ratio). */
    async tiers() {
      const g = game();
      const view = g.boxer.scene;
      const stageView = g.boxer.stage().view;
      const to = (tier, ratio = 2) => () => {
        stageView.setQuality(tier);
        view.renderer.setPixelRatio(ratio);
        g.boxer.playFrames(1, 1 / 60);
      };
      const off = to('high');
      return { high: [to('high'), off], medium: [to('medium'), off], low: [to('low'), off], 'low@1': [to('low', 1), off], 'medium@1.5': [to('medium', 1.5), off] };
    },
    /** A/B variants adding the layers of the picture one by one (see `ab`): nothing but the clear, the sky, the sea, the land, the castle, the men, everything. */
    async layers() {
      const g = game();
      const view = g.boxer.scene;
      const mats = g.boxer.stage().view.mats;
      const menGroups = new Set(g.boxer.state.views.map((v) => v.group));
      const kind = (o) => {
        if (o.material === mats.wear) return 'castle';
        for (let up = o; up; up = up.parent) {
          if (menGroups.has(up)) return 'men';
          if (/^(detail|silhouette):|^dyn:/.test(up.name)) return 'castle';
          if (up.name === 'land') return 'land';
          if (up.name === 'stage-sea') return 'sea';
          if (up.name === 'storm') return o.material?.side === g.THREE.BackSide ? 'sky' : 'weather';
        }
        return 'other';
      };
      const all = [];
      view.scene.traverse((o) => {
        if (o.isMesh || o.isLine || o.isPoints || o.isSprite) all.push([o, kind(o)]);
      });
      const only = (list) => [() => all.forEach(([o, k]) => { o.userData.__v = o.visible; o.visible = o.visible && list.includes(k); }), () => all.forEach(([o]) => { o.visible = o.userData.__v; })];
      return {
        nothing: only([]),
        sky: only(['sky']),
        'sky+sea': only(['sky', 'sea']),
        '+land': only(['sky', 'sea', 'land']),
        '+castle': only(['sky', 'sea', 'land', 'castle']),
        '+men': only(['sky', 'sea', 'land', 'castle', 'men']),
        '+weather': only(['sky', 'sea', 'land', 'castle', 'men', 'weather']),
        all: only(['sky', 'sea', 'land', 'castle', 'men', 'weather', 'other']),
      };
    },
    /**
     * The picture at a place as a PNG data URL, drawn once now (the buffer is read in the same turn it is drawn). `setup(g)`: anything to set first (the storm held
     * still, a tier). The lightning is stilled and the rain hidden so that two copies of the game can be told apart by what they paint.
     */
    snap(g, { still = true, rain = false } = {}) {
      if (still) g.boxer.stageLook(undefined, { still: true });
      const hidden = [];
      if (!rain) g.boxer.scene.scene.traverse((o) => { if (o.isLineSegments && o.visible) { o.visible = false; hidden.push(o); } });
      g.boxer.advance(0);
      const url = g.boxer.scene.renderer.domElement.toDataURL('image/png');
      hidden.forEach((o) => { o.visible = true; });
      return url;
    },
    /** Send a data URL to the server's /__shot (tools/serve.py): it is written to shots/<name>.png. */
    async save(name, url) {
      await fetch(`/__shot?name=${encodeURIComponent(name)}`, { method: 'POST', body: url });
    },
    /**
     * This copy and `base` at a place, the same picture each: saves `<tag>-<place>-new|base|diff` and returns how different they are
     * ({ mean, over }: the mean difference of a channel 0..255, and the share of pixels differing by more than 24). `setup(g, side)` before the shot.
     */
    async shotDiff(place, { tag = 'diff', base = '/.base/', width = 1279, height = 639, setup = null, yaw = null } = {}) {
      const urls = {};
      for (const [side, root] of [['new', '/'], ['base', base]]) {
        await SB.load(width, height, root);
        SB.hop(place, yaw ?? 0);
        const g = game();
        // (The storm held still, and a strike that was already on let to fade: a flash is a picture of its own.)
        g.boxer.stageLook(undefined, { still: true });
        g.boxer.advance(1);
        if (setup) await setup(g, side);
        urls[side] = SB.snap(g);
      }
      const load = (url) => new Promise((done) => { const image = new Image(); image.onload = () => done(image); image.src = url; });
      const [a, b] = await Promise.all([load(urls.new), load(urls.base)]);
      const canvas = document.createElement('canvas');
      canvas.width = a.width;
      canvas.height = a.height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(a, 0, 0);
      const pa = context.getImageData(0, 0, a.width, a.height);
      context.drawImage(b, 0, 0);
      const pb = context.getImageData(0, 0, a.width, a.height);
      let sum = 0;
      let over = 0;
      const out = context.createImageData(a.width, a.height);
      for (let k = 0; k < pa.data.length; k += 4) {
        const d = Math.max(Math.abs(pa.data[k] - pb.data[k]), Math.abs(pa.data[k + 1] - pb.data[k + 1]), Math.abs(pa.data[k + 2] - pb.data[k + 2]));
        sum += d;
        if (d > 24) over += 1;
        out.data[k] = out.data[k + 1] = out.data[k + 2] = Math.min(255, d * 4);
        out.data[k + 3] = 255;
      }
      context.putImageData(out, 0, 0);
      await SB.save(`${tag}-${place}-new`, urls.new);
      await SB.save(`${tag}-${place}-base`, urls.base);
      await SB.save(`${tag}-${place}-diff`, canvas.toDataURL('image/png'));
      return { place, mean: +(sum / (pa.data.length / 4)).toFixed(3), over: +((100 * over) / (pa.data.length / 4)).toFixed(3) };
    },
    /** One row per place. `lines`: the rows as text (default) or objects. */
    async table({ only = null, frames = 30, gpu = true, raw = false } = {}) {
      const g = game();
      const rows = [];
      for (const [name] of PLACES) {
        if (only && !only.includes(name)) continue;
        const where = SB.hop(name);
        if (where.state === 'lost' || where.state === 'out') {
          rows.push({ name, error: where });
          break;
        }
        g.boxer.bench(8);
        // The least of several runs of each part: a shared machine only ever adds time.
        const runs = [0, 1, 2, 3, 4].map(() => g.boxer.bench(frames));
        const least = (key) => Math.min(...runs.map((run) => run[key]));
        const m = { physics: least('physics'), views: least('views'), render: least('render'), frame: least('frame'), calls: runs[0].calls, triangles: runs[0].triangles };
        let card = null;
        if (gpu) {
          const cards = [];
          for (let k = 0; k < 5; k += 1) cards.push((await SB.gpu(12)).med);
          card = Math.min(...cards);
        }
        rows.push({ name, physics: m.physics, views: m.views, render: m.render, frame: m.frame, calls: m.calls, triangles: m.triangles, gpu: card });
      }
      if (raw) return rows;
      return rows.map((r) => (r.error ? `${r.name} ${JSON.stringify(r.error)}` : `${r.name.padEnd(11)} ph ${r.physics} vw ${r.views} rd ${r.render} fr ${r.frame} calls ${r.calls} tri ${r.triangles}${r.gpu === null ? '' : ` gpu ${r.gpu}`}`)).join('\n');
    },
  };
</script>
